<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
    
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            height: 100%;
            display: relative;
        }
        whyun-player {
            position: absolute;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding-bottom: 108px;
        }
        .input-area {
            position: absolute;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            box-shadow: 0 2px 16px 0 rgba(0,0,0,0.08);
            border-radius: 16px;
            padding: 32px 24px;
            gap: 16px;
            bottom: 0;
        }
        .input-area input[type="text"] {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }
        .input-area input[type="text"]:focus {
            border: 1.5px solid #409eff;
        }
        .input-area button {
            padding: 10px 24px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px 0 rgba(64,158,255,0.08);
        }
        .input-area button:hover {
            background: #1976d2;
        }
    </style>
</head>

<body class="">
    <div class="container">
        <whyun-player debug src="https://www.w3school.com.cn/example/html5/mov_bbb.mp4" id="whyunPlayer"></whyun-player>
        <div class="input-area">
            <input type="text" id="videoSrc" placeholder="请输入视频地址" />
            <button id="changeBtn">切换</button>
        </div>
    </div>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script  src="../../lib/webcomponent/whyun_player.js"></script>
  <script>
      var player = document.getElementById('whyunPlayer');

      document.querySelector('#changeBtn').addEventListener('click', function() {
          player.src = (document.querySelector('#videoSrc').value);
      }, false);
  </script>
</body>
</html>
